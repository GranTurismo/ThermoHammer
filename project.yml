name: CpuThrottlingTest
options:
  bundleIdPrefix: com.granturismo
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0
targets:
  CpuThrottlingTest:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    # the scheme runs the unit tests below (`xcodebuild test`)
    scheme:
      testTargets:
        - CpuThrottlingTestTests
    sources:
      - path: CpuThrottlingTest
      # the benchmark's CPU and MEM tests: the same C++ as the Android app, optimised in debug builds too
      - path: BenchCore/src
        compilerFlags: ["-O3"]
      - path: BenchCore/include/bench_core.h
      # zxing-cpp for the QR test (third-party code, so its warnings are off)
      - path: BenchCore/third_party/zxing-cpp/src
        compilerFlags: ["-O3", "-w"]
      # the benchmark's scenes, pages, media and models: the Android app's own assets, shared
      - path: ThermoHammerAndroid/app/src/main/assets/lake_valley.bin
        buildPhase: resources
      - path: ThermoHammerAndroid/app/src/main/assets/neon_city.bin
        buildPhase: resources
      - path: ThermoHammerAndroid/app/src/main/assets/web
        type: folder
        buildPhase: resources
      - path: ThermoHammerAndroid/app/src/main/assets/media
        type: folder
        buildPhase: resources
      - path: ThermoHammerAndroid/app/src/main/assets/ai
        type: folder
        buildPhase: resources
    # the AI test's CPU and GPU runs: TensorFlow Lite 2.17 (static; fetched by Vendor/fetch_tflite.sh)
    dependencies:
      - framework: Vendor/TensorFlowLiteC/TensorFlowLiteC.xcframework
        embed: false
      - framework: Vendor/TensorFlowLiteC/TensorFlowLiteCMetal.xcframework
        embed: false
      - sdk: CoreML.framework
      - sdk: Metal.framework
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalyticsCore
    # more memory than iOS's default per-app limit: the UX test's 8K video decode and export on 4 GB iPhones
    # (it was first added for the LLM test, which version 5 no longer has)
    entitlements:
      path: CpuThrottlingTest/CpuThrottlingTest.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    postBuildScripts:
      - name: Upload Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
    settings:
      SWIFT_OBJC_BRIDGING_HEADER: CpuThrottlingTest/Benchmark/BenchCore-Bridging.h
      HEADER_SEARCH_PATHS: ["$(SRCROOT)/BenchCore/include", "$(SRCROOT)/BenchCore/third_party/zxing-cpp/src"]
      CLANG_CXX_LANGUAGE_STANDARD: "c++17"
      # Arm only: the simulator runs on Apple silicon
      "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      # The Mac app: Mac Catalyst — the same code compiled natively for macOS on Apple silicon (Arm only, as above),
      # in place of the iPad app the App Store showed on Macs. One bundle id, so it's the same App Store listing.
      # Device family stays iPhone + iPad ("Scale Interface to Match iPad"): the desktop layout's sizes are iPad points.
      SUPPORTS_MACCATALYST: YES
      DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
      "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
      # the Mac App Store's sandbox (network for the leaderboard, save panels for exports) — and none of the iPhone's
      # increased-memory-limit entitlement, which macOS has no use for
      "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": CpuThrottlingTest/CpuThrottlingTest-Mac.entitlements
      "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
      OTHER_LDFLAGS: ["-lz", "-lc++", "-ObjC"]
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      # the Neural Engine models (Benchmark/AI/NeuralEngine) are loaded by name, no generated classes
      COREML_CODEGEN_LANGUAGE: None
      PRODUCT_BUNDLE_IDENTIFIER: com.granturismo.thermohammer
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: C58ABB3474
      CODE_SIGNING_ALLOWED: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "2.2.0"
      CURRENT_PROJECT_VERSION: "46"
      INFOPLIST_KEY_CFBundleDisplayName: "ThermoHammer"
      INFOPLIST_KEY_CFBundleName: "ThermoHammer"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UIAppFonts:
        - "Fonts/jetbrainsmono_regular.ttf"
        - "Fonts/jetbrainsmono_medium.ttf"
        - "Fonts/jetbrainsmono_bold.ttf"
        - "Fonts/jetbrainsmono_extrabold.ttf"
        - "Fonts/spacegrotesk_500.ttf"
        - "Fonts/spacegrotesk_700.ttf"
      # iPhone: portrait. iPad: every orientation and multitasking — which is also what gives the app a resizable
      # desktop window on a Mac (a full-screen, portrait-only iPad app gets a fixed phone-shaped one there)
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
        - "UIInterfaceOrientationPortrait"
        - "UIInterfaceOrientationPortraitUpsideDown"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
        - "UIInterfaceOrientationPortrait"
        - "UIInterfaceOrientationPortraitUpsideDown"
        - "UIInterfaceOrientationLandscapeLeft"
        - "UIInterfaceOrientationLandscapeRight"
  # unit tests of the pure logic (share links and texts, CSV, the stress curve, the speed check, benchmark update
  # impact), hosted in the app: `xcodebuild test -scheme CpuThrottlingTest -destination 'platform=iOS Simulator,name=…'`
  CpuThrottlingTestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CpuThrottlingTestTests
    dependencies:
      - target: CpuThrottlingTest
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.granturismo.thermohammer.tests
      DEVELOPMENT_TEAM: C58ABB3474
      CODE_SIGN_STYLE: Automatic
      # the app's module imports BenchCore through its bridging header
      HEADER_SEARCH_PATHS: ["$(SRCROOT)/BenchCore/include", "$(SRCROOT)/BenchCore/third_party/zxing-cpp/src"]
      "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
