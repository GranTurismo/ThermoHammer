name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: granturismo/thapi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ThermoHammer.Api
          file: ./ThermoHammer.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Only runs if the build succeeds

    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASS }}
          port: 22
          script: |
            cd ~/docker/thapi
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker pull ghcr.io/granturismo/thapi:latest

            # The production database login comes from a GitHub secret - never from the repo or
            # the (public) image. It is written to a compose override, which `docker compose`
            # loads automatically, so manual restarts on the server keep working too.
            # Fails closed: if the secret is missing, abort BEFORE touching the running container.
            DB_PW='${{ secrets.DB_APP_PASSWORD }}'
            if [ "${#DB_PW}" -lt 24 ]; then
              echo "DB_APP_PASSWORD secret is missing or too short - aborting before restart"
              exit 1
            fi
            umask 077
            printf 'services:\n  thapi:\n    environment:\n      ConnectionStrings__DefaultConnection: "Server=sqlthermo;Database=thermo;User Id=thermo_app;Password=%s;TrustServerCertificate=True;"\n' "$DB_PW" > docker-compose.override.yaml.tmp
            mv docker-compose.override.yaml.tmp docker-compose.override.yaml

            sudo docker compose up -d